name: Design Studio preview
on:
  push:
    branches: [zth-design-studio, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and package the offline web application
        run: npm run build:web && node scripts/package-web.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZTH-Design-Studio-Web-candidate-${{ github.sha }}
          path: |
            release/*Web.zip
            release/*Web.zip.sha256
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: choco install nsis --no-progress -y
      - name: Run native Windows installer regressions
        run: node scripts/ci-test.cjs
        env:
          ZTH_MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
          ZTH_NSIS_DIR: C:\Program Files (x86)\NSIS
      - run: npm run build:win
        env:
          ZTH_MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
          ZTH_NSIS_DIR: C:\Program Files (x86)\NSIS
      - name: Verify actual production editor render, persistence and restart
        run: node scripts/smoke-windows.cjs && node scripts/hash-installer.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ZTH-Design-Studio-Windows-candidate-${{ github.sha }}
          path: |
            release/*Setup.exe
            release/*Setup.exe.sha256
            qa-output/windows-native.json
          retention-days: 7
