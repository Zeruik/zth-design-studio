name: iOS simulator build
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle offline editor
        run: node scripts/prepare-ios.cjs
      - name: Build unsigned simulator application
        run: |
          set -o pipefail
          xcodebuild -project ios/ZTHDesignStudio.xcodeproj -scheme ZTHDesignStudio -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tee ios-build.log
      - name: Package simulator application
        run: |
          mkdir -p release
          version=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Release-iphonesimulator/ZTHDesignStudio.app release/ZTH-Design-Studio-"$version"-iOS-Simulator.zip
      - name: Launch on an iPhone simulator
        run: |
          set -o pipefail
          bash ios/smoke-simulator.sh | tee ios-simulator.log
      - uses: actions/upload-artifact@v4
        with:
          name: ZTH-Design-Studio-iOS-Simulator-${{ github.sha }}
          path: release/*iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-simulator-screenshot
          path: |
            ios/build/ios-simulator-home.png
            ios-simulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-build-log
          path: ios-build.log
